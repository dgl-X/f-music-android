name: Сборка Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Разрешить запуск Gradle Wrapper
        run: chmod +x gradlew
      - name: Запустить тесты и собрать debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
